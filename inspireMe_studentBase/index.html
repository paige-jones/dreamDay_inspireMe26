<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="animations/animation-styles.css">
    <link rel="stylesheet" href="styles.css">
    <link href="bootstrap/bootstrap.min.css" rel="stylesheet">


    <!-- Name your webpage -->
    <title>Name</title>
   
    <!-- Choose your tab image -->
    <link rel="icon" href="images/" type="image/x-icon">

    <!-- STEP 1: Link to our JavaScript file -->
    <!-- Add the script tag here: <script src="scripts/button-magic.js"></script> -->

</head>

<body>
    <div class="background-overlay">
        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        
                        <!-- Choose your navbar image -->
                        <img src="images/" width="45" height="45">
                    </a>

                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">

                                 <!-- Name a navabr item -->
                                <a class="nav-link" href="#section1">Name</a>

                            </li>
                            <li class="nav-item">

                                 <!-- Name a navabr item -->
                                <a class="nav-link" href="#section2">Name</a>

                            </li>

                            <!-- Create your third nav item here. href="#section3" -->

                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section id="section1" class="py-5 text-center section-margins">
                <div class="container mt-5">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <div class="float-area">

                                <!-- Choose an image for section 1 -->
                                <img src="images/" class="img-fluid home-image floating">

                            </div>
                        </div>
                        <div class="col-md-9">

                            <!-- Write your title -->
                            <h1 class="main-font">
                                My website title
                            </h1>

                            <!-- Write a subtitle -->
                            <p class="second-font">
                                Subtitle
                            </p>

                            <!-- STEP 5: Add a button with class="btn btn-warning moon-button" and onclick="sparkleMagic()" -->
                            <!-- The button text should say "Join Our School ✨" -->


                        </div>
                    </div>
                </div>
            </section>

            <section id="section2" class="py-5 section-margins">
                <div class="container mt-5">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="card">

                                <!-- Add your first card image -->
                                <img src="images/" class="card-image-top leftAndRight">

                                <div class="card-body">

                                    <!-- Add your first card title -->
                                    <h5 class="card-title">Card 1</h5>

                                    <!-- Add your first card description -->
                                    <p class="card-text">Card description 1</p>

                                    <!-- Name your first card button -->
                                    <!-- STEP 2: Add id="button1" and onclick="colorExplosion()" to make the button interactive -->
                                    <a href="javascript:void(0)" class="btn btn-primary">Button 1</a>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="card">

                                <!-- Add your second card image -->
                                <img src="images/" class="card-image-top upAndDown">

                                <div class="card-body">

                                    <!-- Add your second card title -->
                                    <h5 class="card-title">Card 2</h5>

                                    <!-- Add your second card description -->
                                    <p class="card-text">Card description 2</p>

                                    <!-- Name your second card button -->
                                    <!-- STEP 3: Add id="button2" and onclick="celebrationAlert()" to make the button show an alert -->
                                    <a href="javascript:void(0)" class="btn btn-primary">Button 2</a>
                                </div>
                            </div>
                        </div>

                        <!-- Now it's your turn! Create your third card using what you learned from Card 1 and Card 2 -->
                        <!-- Remember to include: -->
                        <!-- 1. An image with src="images/" and class="card-image-top smallCircle" -->
                        <!-- 2. A div with class="card-body" -->
                        <!-- 3. A card title with class="card-title" -->
                        <!-- 4. A card description with class="card-text" -->
                        <!-- 5. A button with class="btn btn-primary" -->
                        <!-- STEP 4: Add id="button3" and onclick="textChangeMagic()" to your third button -->
                        <div class="col-md-4">
                            <div class="card">

                                </div>
                            </div>
                        </div>
                    </div>


                    <!-- Creative Coding Time! -->
                    <!-- This section is for you to be creative! -->
                    <!-- Look at the example file (inspireMe_example) to see what you can create -->
                    <!-- Ideas: Add more images, create columns with text, add more animations -->
                    <section id="section3" class="py-5 text-center section-margins">
                        <div class="container">
                            <!-- Add your section title here using class="main-font" -->

                            <div class="row">
                                <!-- Add your creative content here! You can add more col-md-4 divs -->
                                <div class="col-md-4">

                                <!-- Try adding images, text, or other elements you've learned -->

                                </div>
                            </div>
                        </div>
                    </section>

                </div>
            </section>
        </main>
    </div>
</body>
</html>
